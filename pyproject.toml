[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "directory-tree"
version = "0.1.1"
description = "Generate directory trees for the terminal and Markdown, with glob ignores, depth limits, and file sizes."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["directory", "tree", "file", "cli", "markdown", "glob"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
directory-tree = "directory_tree.cli:main"
dirtree = "directory_tree.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/directory-tree"
Repository = "https://github.com/Master-626/directory-tree"
Issue-Tracker = "https://github.com/Master-626/directory-tree/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
