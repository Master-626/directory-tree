[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "directory-tree"
version = "0.1.0"
description = "Generate beautiful directory tree with filtering and Markdown export"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["directory", "tree", "file", "cli", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
directory-tree = "directory_tree.cli:main"
dirtree = "directory_tree.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/directory-tree"
Repository = "https://github.com/Master-626/directory-tree"
Issue-Tracker = "https://github.com/Master-626/directory-tree/issues"
